services:
  db:
    image: postgres:16-alpine
    container_name: exam_db
    environment:
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam
      POSTGRES_DB: examdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam -d examdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./exam-preparation-backend
      dockerfile: Dockerfile
    container_name: exam_backend
    env_file:
      - ./exam-preparation-backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://exam:exam@db:5432/examdb?schema=public
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - ./exam-preparation-backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./exam-preparation-frontend
      dockerfile: Dockerfile
    container_name: exam_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
